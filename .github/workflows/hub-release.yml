name: hub-release

# Builds Yendory Hub installers on GitHub's machines and publishes them as a pre-release on the
# repository's Releases page:
#   Windows  : NSIS setup .exe
#   Linux    : .deb and .AppImage
# - A branch push that changes the Hub or the Engine publishes a development pre-release tagged
#   `hub-v<version>-dev.<run number>` (the newest 5 are kept; older ones are removed). Studio's
#   releases (`studio-v…`) are never touched.
# - A pushed tag like `hub-v0.1.0` publishes a pre-release with that tag.
# - A manual run from the Actions tab publishes with the tag you enter, or a development tag.

on:
  push:
    tags: ["hub-v*"]
    branches: ["**"]
    paths:
      - "apps/hub/**"
      - "crates/yendory-engine/src/**"
      - ".github/workflows/hub-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: release tag (e.g. hub-v0.1.0). Leave empty for a development pre-release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: hub-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Hub checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/hub/src-tauri -> target"
      - run: node --check apps/hub/web/js/app.js && node --check apps/hub/web/js/dropdown.js
      - run: cargo fmt --check
        working-directory: apps/hub/src-tauri
      - run: cargo clippy --release --all-targets -- -D warnings
        working-directory: apps/hub/src-tauri
      - run: cargo test --release
        working-directory: apps/hub/src-tauri

  desktop:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            bundles: nsis
            files: |
              apps/hub/src-tauri/target/release/bundle/nsis/*.exe
              apps/hub/src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: Linux packages
            os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              apps/hub/src-tauri/target/release/bundle/deb/*.deb
              apps/hub/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/hub/src-tauri/target/release/bundle/appimage/*.AppImage.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/hub/src-tauri -> target"
      - name: Tauri CLI
        working-directory: apps/hub
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/hub
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # With the updater key (repository secret TAURI_SIGNING_PRIVATE_KEY, the same key as
          # Studio's), the Windows installer and the AppImage are also signed for the Hub's own
          # updates (apps/hub/src-tauri/src/update.rs); without it they are built unsigned.
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret: built without update signatures"
            npx tauri build --bundles ${{ matrix.bundles }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/hub/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Choose the tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/hub/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/hub-v* ]]; then
            TAG="$GITHUB_REF_NAME"; DEV=false
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"; DEV=false
          else
            TAG="hub-v$VERSION-dev.$GITHUB_RUN_NUMBER"; DEV=true
          fi
          [[ "$TAG" =~ ^hub-v[0-9A-Za-z.+-]+$ ]] || { echo "::error::Bad tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
      - name: Publish to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEV: ${{ steps.tag.outputs.dev }}
        run: |
          set -euo pipefail
          # Installer names contain spaces ("Yendory Hub_0.1.0_amd64.deb"): keep them intact.
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt dist/
          mapfile -d '' FILES < <(find dist -type f -print0 | sort -z)
          printf '%s\n' "${FILES[@]}"
          {
            if [[ "$DEV" == true ]]; then
              echo "Development build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA:0:7}. Only the newest 5 development builds of the Hub are kept."
            else
              echo "Yendory Hub desktop builds, made by GitHub Actions from ${GITHUB_SHA:0:7}."
            fi
            cat <<'NOTES'

          - **Windows:** run the `-setup.exe`. It is not code-signed, so Windows SmartScreen may warn; choose "More info" → "Run anyway". It installs over an earlier version and keeps your shelves and settings.
          - **Linux:** install the `.deb`, or make the `.AppImage` executable and run it.
          - The Hub uses Studio's models folder, so the models you made in Studio are on its shelf, and it can install Studio for you (Downloads & updates).

          Built by CI only: these installers have not been tested on a physical device for this release. `SHA256SUMS.txt` lists the checksum of every file.
          NOTES
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yendory Hub ${TAG#hub-v}" --notes-file notes.md --prerelease --latest=false \
              "${FILES[@]}"
          fi
      - name: Update manifest for the Hub's built-in updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # latest.json says which build is newest, where its installers are and their update
          # signatures. The Hub reads it from the fixed `hub-updates` release (tauri.conf.json,
          # plugins.updater). Written only when the builds were signed.
          if ! find dist -name '*.sig' | grep -q .; then
            echo "::notice::No update signatures (no TAURI_SIGNING_PRIVATE_KEY secret): no update manifest"
            exit 0
          fi
          VERSION="$(node -p "require('./apps/hub/package.json').version")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          python3 - "$VERSION" "$TAG" > latest.json <<'PY'
          import json, sys, glob, os, datetime
          version, tag = sys.argv[1], sys.argv[2]
          assets = {a["name"]: a["url"] for a in json.load(open("assets.json"))["assets"]}
          def url_of(local):
              # GitHub renames spaces in asset names to dots.
              name = os.path.basename(local)
              for candidate in (name, name.replace(" ", ".")):
                  if candidate in assets:
                      return assets[candidate]
              raise SystemExit(f"{name} is not among the release's files")
          platforms = {}
          for pattern, key in (("dist/**/*-setup.exe.sig", "windows-x86_64"), ("dist/**/*.AppImage.sig", "linux-x86_64")):
              for sig in glob.glob(pattern, recursive=True):
                  platforms[key] = {"signature": open(sig).read().strip(), "url": url_of(sig[: -len(".sig")])}
          json.dump({
              "version": version,
              "notes": f"Yendory Hub {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }, sys.stdout, indent=2)
          PY
          cat latest.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber latest.json
          if ! gh release view hub-updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create hub-updates --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yendory Hub updates" --prerelease --latest=false \
              --notes "Where Yendory Hub looks for updates (latest.json). Download installers from the build releases."
          fi
          gh release upload hub-updates --repo "$GITHUB_REPOSITORY" --clobber latest.json
      - name: Remove old development pre-releases
        if: steps.tag.outputs.dev == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^hub-v.*-dev\\.[0-9]+$")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
