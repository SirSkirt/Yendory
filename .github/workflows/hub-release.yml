name: hub-release

# Builds Yendory Hub and the Yendory Network on GitHub's machines and publishes them
# (docs/PACKAGES.md):
#
# - The Hub's installers, the one thing people download: Windows `-setup.exe`, Linux `.deb` and
#   `.AppImage`, on a pre-release `hub-v<version>-dev.<run>` (the newest 5 are kept).
# - The Hub's own packages (how it updates itself, without an installer window) and
#   `package.json` on the fixed `hub-updates` release.
# - The Yendory Network's packages on `network-v<version>` and `package.json` on the fixed
#   `network-updates` release, when dependency/network's version is new.
# - Every package is signed with the project's updater key (repository secret
#   TAURI_SIGNING_PRIVATE_KEY); the Hub installs nothing unsigned.
# - `latest.json` on `hub-updates` (Tauri's updater format) lets Hub 0.1.0, which updated through
#   Tauri's updater, reach this Hub once.

on:
  push:
    tags: ["hub-v*"]
    branches: ["**"]
    paths:
      - "apps/hub/**"
      - "dependency/**"
      - ".github/workflows/hub-release.yml"
      - ".github/scripts/package.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: release tag (e.g. hub-v0.1.1). Leave empty for a development pre-release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: hub-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Hub and Network checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/hub/src-tauri -> target
            . -> target
      - run: node --check apps/hub/web/js/app.js && node --check apps/hub/web/js/dropdown.js
      - run: cargo fmt --check
        working-directory: apps/hub/src-tauri
      - run: cargo clippy --release --all-targets -- -D warnings
        working-directory: apps/hub/src-tauri
      - run: cargo test --release
        working-directory: apps/hub/src-tauri
      # The Network as programs see it (the real service, through yendory-client).
      - run: cargo test --release -p yendory-network -p yendory-client

  desktop:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            platform: windows-x86_64
            network_features: dxc
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            platform: linux-x86_64
            network_features: gpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/hub/src-tauri -> target
            . -> target
      - name: Tauri CLI
        working-directory: apps/hub
        run: npm ci --no-audit --no-fund
      - name: Signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is missing: packages can't be signed, and the Hub installs nothing unsigned"
            exit 1
          fi
      - name: Build the Hub
        working-directory: apps/hub
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Updater artifacts: the .sig files Hub 0.1.0's updater needs (latest.json).
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Build the Network
        shell: bash
        run: cargo build --release -p yendory-network --features ${{ matrix.network_features }}
      - name: Make and sign the packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          HUB="$(node -p "require('./apps/hub/package.json').version")"
          NET="$(grep -m1 '^version' dependency/network/Cargo.toml | cut -d'"' -f2)"
          P=.github/scripts/package.py
          mkdir -p out/installers out/packages
          B=apps/hub/src-tauri/target/release
          # This version's files only (the build cache can hold earlier versions' installers).
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            SETUP="$B/bundle/nsis/Yendory Hub_${HUB}_x64-setup.exe"
            cp "$SETUP" "$SETUP.sig" out/installers/
            python $P zip "out/packages/yendory-hub_${HUB}_windows-x86_64.zip" "$B/yendory-hub.exe"
            python $P zip "out/packages/yendory-network_${NET}_windows-x86_64.zip" "target/release/yendory-network.exe"
          else
            DEB="$B/bundle/deb/Yendory Hub_${HUB}_amd64.deb"
            APPIMAGE="$B/bundle/appimage/Yendory Hub_${HUB}_amd64.AppImage"
            cp "$DEB" "$APPIMAGE" "$APPIMAGE.sig" out/installers/
            python3 $P zip "out/packages/yendory-hub_${HUB}_linux-x86_64-appimage.zip" "$APPIMAGE=Yendory-Hub.AppImage"
            cp "$DEB" "out/packages/yendory-hub_${HUB}_amd64.deb"
            python3 $P zip "out/packages/yendory-network_${NET}_linux-x86_64.zip" "target/release/yendory-network"
          fi
          for f in out/packages/*; do
            npx --prefix apps/hub tauri signer sign "$f" > /dev/null
            test -s "$f.sig"
          done
          ls -la out/installers out/packages
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out
          if-no-files-found: error

  release:
    name: Publish
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Choose the tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          HUB="$(node -p "require('./apps/hub/package.json').version")"
          NET="$(grep -m1 '^version' dependency/network/Cargo.toml | cut -d'"' -f2)"
          if [[ "$GITHUB_REF" == refs/tags/hub-v* ]]; then
            TAG="$GITHUB_REF_NAME"; DEV=false
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"; DEV=false
          else
            TAG="hub-v$HUB-dev.$GITHUB_RUN_NUMBER"; DEV=true
          fi
          [[ "$TAG" =~ ^hub-v[0-9A-Za-z.+-]+$ ]] || { echo "::error::Bad tag: $TAG"; exit 1; }
          { echo "tag=$TAG"; echo "dev=$DEV"; echo "hub=$HUB"; echo "network=$NET"; } >> "$GITHUB_OUTPUT"
      - name: Publish the Hub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEV: ${{ steps.tag.outputs.dev }}
          HUB: ${{ steps.tag.outputs.hub }}
        run: |
          set -euo pipefail
          mapfile -d '' FILES < <(find dist -path '*/installers/*' -type f -print0; find dist -path '*/packages/yendory-hub_*' -type f -print0)
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt)
          FILES+=(SHA256SUMS.txt)
          {
            if [[ "$DEV" == true ]]; then
              echo "Development build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA:0:7}. Only the newest 5 development builds of the Hub are kept."
            else
              echo "Yendory Hub, built by GitHub Actions from ${GITHUB_SHA:0:7}."
            fi
            cat <<'NOTES'

          **Install the Hub**, then let it install the rest (the Yendory Network, Studio):

          - **Windows:** run the `-setup.exe`. It is not code-signed, so Windows SmartScreen may warn; choose "More info" → "Run anyway". From then on the Hub updates itself.
          - **Linux:** install the `.deb`, or make the `.AppImage` executable and run it.

          The `yendory-hub_*` files are the Hub's own update packages; the Hub downloads them itself. Built by CI only: not tested on a physical device for this release. `SHA256SUMS.txt` lists every file's checksum.
          NOTES
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yendory Hub ${TAG#hub-v}" --notes-file notes.md --prerelease --latest=false "${FILES[@]}"
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          PK=dist/windows-x86_64/packages; PL=dist/linux-x86_64/packages
          python3 .github/scripts/package.py manifest --id hub --name "Yendory Hub" --version "$HUB" --notes "Yendory Hub $TAG" \
            --platform "windows-x86_64=$PK/yendory-hub_${HUB}_windows-x86_64.zip,yendory-hub.exe,$URL/yendory-hub_${HUB}_windows-x86_64.zip" \
            --platform "linux-x86_64-appimage=$PL/yendory-hub_${HUB}_linux-x86_64-appimage.zip,Yendory-Hub.AppImage,$URL/yendory-hub_${HUB}_linux-x86_64-appimage.zip" \
            --platform "linux-x86_64-deb=$PL/yendory-hub_${HUB}_amd64.deb,yendory-hub,$URL/yendory-hub_${HUB}_amd64.deb" \
            > package.json
          cat package.json
          # Tauri's updater format, for Hub 0.1.0 (its installer and AppImage, signed at build).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          python3 - "$HUB" "$TAG" > latest.json <<'PY'
          import json, sys, glob, os, datetime
          version, tag = sys.argv[1], sys.argv[2]
          assets = {a["name"]: a["url"] for a in json.load(open("assets.json"))["assets"]}
          def url_of(local):
              name = os.path.basename(local)
              for candidate in (name, name.replace(" ", ".")):
                  if candidate in assets:
                      return assets[candidate]
              raise SystemExit(f"{name} is not among the release's files")
          platforms = {}
          for pattern, key in (("dist/**/installers/*-setup.exe.sig", "windows-x86_64"), ("dist/**/installers/*.AppImage.sig", "linux-x86_64")):
              for sig in glob.glob(pattern, recursive=True):
                  platforms[key] = {"signature": open(sig).read().strip(), "url": url_of(sig[: -len(".sig")])}
          json.dump({"version": version, "notes": f"Yendory Hub {tag}",
                     "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "platforms": platforms}, sys.stdout, indent=2)
          PY
          if ! gh release view hub-updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create hub-updates --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yendory Hub updates" --prerelease --latest=false \
              --notes "Where Yendory Hub looks for its updates (package.json). Download the Hub from its build releases."
          fi
          gh release upload hub-updates --repo "$GITHUB_REPOSITORY" --clobber package.json latest.json
      - name: Publish the Network (when its version is new)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NET: ${{ steps.tag.outputs.network }}
        run: |
          set -euo pipefail
          TAG="network-v$NET"
          PUBLISHED="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/network-updates/package.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)"
          if [[ "$PUBLISHED" == "$NET" ]]; then
            echo "Yendory Network $NET is already published"
            exit 0
          fi
          mapfile -d '' FILES < <(find dist -path '*/packages/yendory-network_*' -type f -print0)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yendory Network $NET" --prerelease --latest=false \
              --notes "The Yendory Network $NET (the background service that runs the Yendory Engine), built from ${GITHUB_SHA:0:7}. Installed and updated by Yendory Hub." \
              "${FILES[@]}"
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          PK=dist/windows-x86_64/packages; PL=dist/linux-x86_64/packages
          python3 .github/scripts/package.py manifest --id network --name "Yendory Network" --version "$NET" --notes "Yendory Network $NET" \
            --platform "windows-x86_64=$PK/yendory-network_${NET}_windows-x86_64.zip,yendory-network.exe,$URL/yendory-network_${NET}_windows-x86_64.zip" \
            --platform "linux-x86_64=$PL/yendory-network_${NET}_linux-x86_64.zip,yendory-network,$URL/yendory-network_${NET}_linux-x86_64.zip" \
            > package.json
          cat package.json
          if ! gh release view network-updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create network-updates --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yendory Network updates" --prerelease --latest=false \
              --notes "Where Yendory Hub looks for the Yendory Network (package.json)."
          fi
          gh release upload network-updates --repo "$GITHUB_REPOSITORY" --clobber package.json
      - name: Remove old development pre-releases
        if: steps.tag.outputs.dev == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^hub-v.*-dev\\.[0-9]+$")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
