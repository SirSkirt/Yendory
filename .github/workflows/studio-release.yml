name: studio-release

# Builds Yendory Studio installers on GitHub's machines:
#   Windows  : NSIS setup .exe
#   Linux    : .deb and .AppImage
#   Android  : signed .apk (arm64 + armv7 phones)
# Push a tag like `studio-v0.1.0` to publish a GitHub Release with all of them. Branch pushes that
# change the app, and manual runs from the Actions tab, attach the installers to the run as
# artifacts; a manual run creates a release only if you enter a tag.

on:
  push:
    tags: ["studio-v*"]
    # Pushes that change the app or the Engine build all installers as artifacts (no release),
    # so every change is proven to package on Windows, Linux and Android.
    branches: ["**"]
    paths:
      - "apps/studio/**"
      - "crates/yendory-engine/src/**"
      - ".github/workflows/studio-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: create a release with this tag (e.g. studio-v0.1.0). Leave empty for artifacts only."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Studio checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/studio/src-tauri -> target"
      - run: node --check apps/studio/web/js/app.js && node --check apps/studio/web/js/brain.js
      - run: cargo test --release
        working-directory: apps/studio/src-tauri

  desktop:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            bundles: nsis
            files: apps/studio/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux packages
            os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              apps/studio/src-tauri/target/release/bundle/deb/*.deb
              apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/studio/src-tauri -> target"
      - name: Tauri CLI
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/studio
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          test -d "${ANDROID_NDK_LATEST_HOME:-}" || { echo "::error::No preinstalled Android NDK"; exit 1; }
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/studio/src-tauri -> target"
      - name: Tauri CLI
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund
      - name: Generate the Android project and launcher icons
        working-directory: apps/studio
        run: |
          npx tauri android init --ci --skip-targets-install
          npx tauri icon app-icon.png
      - name: Build release APK
        working-directory: apps/studio
        run: npx tauri android build --apk --ci --target aarch64 --target armv7
      - name: Sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"; PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Signing with the repository's private key."
          else
            KS=apps/studio/keys/yendory-dev.jks; PASS=yendory-dev; ALIAS=yendory-dev; KPASS=yendory-dev
            echo "::warning::Signing with the PUBLIC development key (apps/studio/keys/README.md). Fine for your own phone, not for public distribution."
          fi
          UNSIGNED="$(find apps/studio/src-tauri/gen/android -name '*release-unsigned.apk' | head -n 1)"
          test -n "$UNSIGNED"
          VERSION="$(node -p "require('./apps/studio/package.json').version")"
          OUT="Yendory-Studio-$VERSION-android.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KPASS" --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | grep -E "Verified|SHA-256"
          for abi in arm64-v8a armeabi-v7a; do unzip -Z1 "$OUT" | grep -q "^lib/$abi/" || { echo "::error::missing $abi"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: Yendory-Studio-*-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/studio-v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Installer names contain spaces ("Yendory Studio_0.1.0_amd64.deb"): keep them intact.
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt dist/
          mapfile -d '' FILES < <(find dist -type f -print0 | sort -z)
          printf '%s\n' "${FILES[@]}"
          cat > notes.md <<'NOTES'
          Yendory Studio desktop and Android builds, made by GitHub Actions from this commit.

          - **Windows:** run the `-setup.exe`. It is not code-signed, so Windows SmartScreen may warn; choose "More info" → "Run anyway".
          - **Linux:** install the `.deb`, or make the `.AppImage` executable and run it.
          - **Android:** install the `.apk` (allow installs from this source). Keep Studio open while it teaches.

          Built by CI only: these installers have not been tested on a physical device for this release.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Yendory Studio ${TAG#studio-v}" --notes-file notes.md --prerelease \
            "${FILES[@]}"
