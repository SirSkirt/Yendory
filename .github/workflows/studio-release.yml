name: studio-release

# Builds Yendory Studio installers on GitHub's machines and publishes them as a pre-release on the
# repository's Releases page:
#   Windows  : NSIS setup .exe
#   Linux    : .deb and .AppImage
#   Android  : .apk for arm64 + armv7 phones, signed with the committed debug key
# - A branch push that changes the app or the Engine publishes a development pre-release tagged
#   `studio-v<version>-dev.<run number>` (the newest 5 are kept; older ones are removed).
# - A pushed tag like `studio-v0.1.0` publishes a pre-release with that tag.
# - A manual run from the Actions tab publishes with the tag you enter, or a development tag.

on:
  push:
    tags: ["studio-v*"]
    # Pushes that change the app or the Engine build and publish a development pre-release.
    branches: ["**"]
    paths:
      - "apps/studio/**"
      - "crates/yendory-engine/src/**"
      - ".github/workflows/studio-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: release tag (e.g. studio-v0.1.0). Leave empty for a development pre-release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Studio checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/studio/src-tauri -> target"
      - run: node --check apps/studio/web/js/app.js && node --check apps/studio/web/js/brain.js
      - run: cargo test --release
        working-directory: apps/studio/src-tauri

  desktop:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            bundles: nsis
            files: apps/studio/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux packages
            os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              apps/studio/src-tauri/target/release/bundle/deb/*.deb
              apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/studio/src-tauri -> target"
      - name: Tauri CLI
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/studio
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          test -d "${ANDROID_NDK_LATEST_HOME:-}" || { echo "::error::No preinstalled Android NDK"; exit 1; }
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/studio/src-tauri -> target"
      - name: Tauri CLI
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund
      - name: Generate the Android project and launcher icons
        working-directory: apps/studio
        run: |
          npx tauri android init --ci --skip-targets-install
          npx tauri icon app-icon.png
      - name: Build release APK
        working-directory: apps/studio
        run: npx tauri android build --apk --ci --target aarch64 --target armv7
      - name: Sign with the Yendory debug key
        shell: bash
        run: |
          set -euo pipefail
          # Every build is signed with the one committed debug key (apps/studio/keys/README.md),
          # so a new APK installs over the previous one and keeps the app's models.
          KS=apps/studio/keys/yendory-debug.jks
          UNSIGNED="$(find apps/studio/src-tauri/gen/android -name '*release-unsigned.apk' | head -n 1)"
          test -n "$UNSIGNED"
          VERSION="$(node -p "require('./apps/studio/package.json').version")"
          OUT="Yendory-Studio-$VERSION-android.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KS" --ks-pass pass:yendory-debug --ks-key-alias yendory-debug --key-pass pass:yendory-debug --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "SHA-256 digest: 323c7c506fd8a16012f49660af71cacfa9889a024add1cec8411dc45c69324e1" "$RUNNER_TEMP/certs.txt"
          for abi in arm64-v8a armeabi-v7a; do unzip -Z1 "$OUT" | grep -q "^lib/$abi/" || { echo "::error::missing $abi"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: Yendory-Studio-*-android.apk
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/studio/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Choose the tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/studio/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/studio-v* ]]; then
            TAG="$GITHUB_REF_NAME"; DEV=false
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"; DEV=false
          else
            TAG="studio-v$VERSION-dev.$GITHUB_RUN_NUMBER"; DEV=true
          fi
          [[ "$TAG" =~ ^studio-v[0-9A-Za-z.+-]+$ ]] || { echo "::error::Bad tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
      - name: Publish to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEV: ${{ steps.tag.outputs.dev }}
        run: |
          set -euo pipefail
          # Installer names contain spaces ("Yendory Studio_0.1.0_amd64.deb"): keep them intact.
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt dist/
          mapfile -d '' FILES < <(find dist -type f -print0 | sort -z)
          printf '%s\n' "${FILES[@]}"
          {
            if [[ "$DEV" == true ]]; then
              echo "Development build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA:0:7}. Only the newest 5 development builds are kept."
            else
              echo "Yendory Studio desktop and Android builds, made by GitHub Actions from ${GITHUB_SHA:0:7}."
            fi
            cat <<'NOTES'

          - **Windows:** run the `-setup.exe`. It is not code-signed, so Windows SmartScreen may warn; choose "More info" → "Run anyway".
          - **Linux:** install the `.deb`, or make the `.AppImage` executable and run it.
          - **Android:** install the `.apk` (allow installs from this source). Every build is signed with the same debug key, so it installs over the previous one and keeps your models. Keep Studio open while it teaches.

          Built by CI only: these installers have not been tested on a physical device for this release. `SHA256SUMS.txt` lists the checksum of every file.
          NOTES
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run of the same workflow run: replace the files.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Yendory Studio ${TAG#studio-v}" --notes-file notes.md --prerelease --latest=false \
              "${FILES[@]}"
          fi
      - name: Remove old development pre-releases
        if: steps.tag.outputs.dev == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^studio-v.*-dev\\.[0-9]+$")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
