name: engine

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo clippy --release --all-targets --features gpu -- -D warnings
      # Includes the golden vectors and the real step-15,000 checkpoint vs the numpy reference.
      - run: cargo test --release --all-targets
      - name: Software Vulkan for the GPU tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: GPU training matches the CPU (software GPU)
        if: runner.os == 'Linux'
        env:
          YENDORY_GPU_SOFTWARE: "1"
        run: cargo test --release --features gpu --test gpu --test gpu_neuro --test gpu_memory -- --nocapture --test-threads 1
      - name: GPU training matches the CPU through DirectX 12 with DXC (Windows software GPU, WARP)
        if: runner.os == 'Windows'
        env:
          YENDORY_GPU_SOFTWARE: "1"
          WGPU_BACKEND: dx12
        run: cargo test --release --features dxc --test gpu --test gpu_neuro --test gpu_memory -- --nocapture --test-threads 1
      - name: Fixture integrity
        shell: bash
        working-directory: tests/compat/fixtures
        run: sha256sum -c SHA256SUMS

  reference:
    name: numpy reference selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - working-directory: reference
        run: python selftest.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Larger size presets (4M, 5M, 8M, 15M) vs the numpy reference
        run: |
          cargo run --release --example size_compat -- "$RUNNER_TEMP/sizes"
          cd reference && python check_sizes.py "$RUNNER_TEMP/sizes"

