name: engine

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      # Includes the golden vectors and the real step-15,000 checkpoint vs the numpy reference.
      - run: cargo test --release --all-targets
      - name: Fixture integrity
        shell: bash
        run: sha256sum -c tests/compat/fixtures/SHA256SUMS

  reference:
    name: numpy reference selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - working-directory: reference
        run: python selftest.py
