name: engine

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      # Includes the golden vectors and the real step-15,000 checkpoint vs the numpy reference.
      - run: cargo test --release --all-targets
      - name: Fixture integrity
        shell: bash
        working-directory: tests/compat/fixtures
        run: sha256sum -c SHA256SUMS

  reference:
    name: numpy reference selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - working-directory: reference
        run: python selftest.py

  studio:
    name: Studio app (Linux build, tests, lint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/studio/src-tauri -> target"
      - run: node --check apps/studio/web/js/app.js && node --check apps/studio/web/js/brain.js
      - run: cargo fmt --check
        working-directory: apps/studio/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/studio/src-tauri
      - run: cargo test
        working-directory: apps/studio/src-tauri
