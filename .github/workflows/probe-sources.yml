# Temporary: checks the reading sources (URLs, formats, first rows) from a GitHub runner.
name: probe-sources
on:
  push:
    branches: [claude/review-handoff-idea-g7uc12]
    paths: [.github/workflows/probe-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hugging Face datasets (splits and first rows)
        run: |
          ds() { echo "=== $1 / $2 / $3"; curl -sS --max-time 60 "https://datasets-server.huggingface.co/splits?dataset=$1" | head -c 1500; echo;
                 curl -sS --max-time 60 "https://datasets-server.huggingface.co/rows?dataset=$1&config=$2&split=$3&offset=0&length=2" | head -c 3500; echo; }
          ds allenai/soda default train
          ds google/Synthetic-Persona-Chat default train
          ds li2017dailydialog/daily_dialog default train
          ds facebook/babi_qa en-10k-qa1 train
          ds openai/gsm8k main train
          ds wikimedia/wikipedia 20231101.simple train
          ds tasksource/proofwriter default train
          ds roneneldan/TinyStories default train
          echo "=== size of wikipedia simple / soda"
          curl -sS --max-time 60 "https://datasets-server.huggingface.co/size?dataset=wikimedia/wikipedia" | head -c 600; echo
          curl -sS --max-time 60 "https://datasets-server.huggingface.co/size?dataset=allenai/soda" | head -c 600; echo
          curl -sS --max-time 60 "https://datasets-server.huggingface.co/parquet?dataset=allenai/soda" | head -c 1200; echo
          curl -sS --max-time 60 "https://huggingface.co/api/datasets/allenai/soda/tree/main" | head -c 1500; echo
          curl -sS --max-time 60 "https://huggingface.co/api/datasets/google/Synthetic-Persona-Chat/tree/main/data" | head -c 1500; echo
          curl -sS --max-time 60 "https://huggingface.co/api/datasets/facebook/babi_qa/tree/main" | head -c 1500; echo
          curl -sS --max-time 60 "https://huggingface.co/api/datasets/tasksource/proofwriter/tree/main" | head -c 1500; echo
          curl -sS --max-time 60 "https://huggingface.co/api/datasets/li2017dailydialog/daily_dialog/tree/main" | head -c 1500; echo
      - name: Hugging Face licences
        run: |
          for d in allenai/soda google/Synthetic-Persona-Chat li2017dailydialog/daily_dialog facebook/babi_qa openai/gsm8k wikimedia/wikipedia tasksource/proofwriter; do
            echo "=== $d"; curl -sS --max-time 60 "https://huggingface.co/api/datasets/$d" | python3 -c "import json,sys; d=json.load(sys.stdin); print([t for t in d.get('tags',[]) if t.startswith('license')], d.get('cardData',{}).get('license'))"; done
      - name: Other hosts
        run: |
          for u in https://dl.fbaipublicfiles.com/babi/tasks_1-20_v1-2.tar.gz http://yanran.li/files/ijcnlp_dailydialog.zip https://raw.githubusercontent.com/openai/grade-school-math/master/grade_school_math/data/train.jsonl https://aristo-data-public.s3.amazonaws.com/proofwriter/proofwriter-dataset-V2020.12.3.zip; do
            echo "=== $u"; curl -sS -I -L --max-time 60 "$u" | grep -iE "^(HTTP|content-length|content-type)"; done
      - name: Gutenberg books
        run: |
          for id in 11 12 16 21 55 74 113 120 146 236 271 289 500 514 902 1448 1597 2591 2781 11339 11757 19994 45 17208 25344 7439; do
            t=$(curl -sS -L --max-time 60 "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" | head -c 4000 | grep -m1 -E "^Title:" | tr -d '\r')
            s=$(curl -sS -I -L --max-time 60 "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" | grep -i "^content-length" | tail -1 | tr -d '\r')
            echo "$id | $t | $s"; done
