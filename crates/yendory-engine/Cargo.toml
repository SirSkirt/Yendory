[package]
name = "yendory-engine"
version = "0.6.5"
description = "Yendory Engine: the Bicameral neural architecture (Transformer + Dense + interconnect), no ML frameworks"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# License: to be decided by the project owner (see NOTICE for the MIT terms of the code
# carried over from Neural Nova).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GPU training (optional): compute shaders through DirectX 12, Vulkan or Metal.
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
# System RAM available for offloading training state (GPU builds).
sysinfo = { version = "0.37", optional = true, default-features = false, features = ["system"] }

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:sysinfo"]
# DirectX 12 with Microsoft's current shader compiler (DXC) built in, instead of falling back to
# the old FXC compiler when dxcompiler.dll is not installed. Only affects Windows (MSVC) builds.
dxc = ["gpu", "wgpu/static-dxc"]

[[example]]
name = "gpu_check"
required-features = ["gpu"]

[[example]]
name = "gpu_profile"
required-features = ["gpu"]
