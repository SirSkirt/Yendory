[package]
name = "yendory-network"
version = "0.1.3"
description = "Yendory Network: the background service that runs the Yendory Engine for every program of the suite"
edition.workspace = true
# File locking (the single running copy) needs Rust 1.89.
rust-version = "1.89"
repository.workspace = true
publish = false

[[bin]]
name = "yendory-network"
path = "src/main.rs"

[lib]
name = "yendory_network"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
yendory-client = { path = "../client" }
yendory-engine = { path = "../engine" }

[features]
# GPU training through the Engine (Studio's training moves here).
gpu = ["yendory-engine/gpu"]
dxc = ["gpu", "yendory-engine/dxc"]
