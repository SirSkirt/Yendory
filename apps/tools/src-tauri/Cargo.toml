[package]
name = "yendory-tools"
version = "0.1.5"
description = "Yendory Tools: games and apps that trained Yendory models play and use, through Nexus"
edition = "2021"
publish = false

[workspace]

[lib]
name = "yendory_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Recordings: each frame compressed on its own, so any frame can be read directly.
flate2 = "1"
# The Yendory Network client (every model move is written by the Network) and the Engine for what
# needs no model: Nexus's markers and announcements, and checking lessons. From yendory-hub
# (dependency/), pinned to one commit; move the pin on purpose.
yendory-client = { git = "https://github.com/SirSkirt/Yendory", rev = "f4f03ca49b1e373fb8e420f8f0873fb658dae8ad" }
yendory-engine = { git = "https://github.com/SirSkirt/Yendory", rev = "f4f03ca49b1e373fb8e420f8f0873fb658dae8ad" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# A second copy of Tools hands its --model to the running one (docs/HANDOFF.md on yendory-hub).
tauri-plugin-single-instance = "2"
# The test range's window (`--range`), with the windowing library Tauri already uses.
tao = "0.37"

[target.'cfg(target_os = "linux")'.dependencies]
# The range draws with GTK on Linux (the same GTK as Tauri's windows).
gtk = "0.18"
# Game windows, capture, virtual input (XTEST) and the emergency stop key on X11, in plain Rust.
x11rb = { version = "0.13", features = ["xtest", "xinput"] }

[target.'cfg(windows)'.dependencies]
# The range draws with softbuffer on Windows (already in Tauri's tree there).
softbuffer = "0.4"
# Game windows, capture (GDI), virtual input (SendInput) and the emergency stop key (a keyboard hook).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"

