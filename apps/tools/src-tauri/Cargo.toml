[package]
name = "yendory-tools"
version = "0.1.0"
description = "Yendory Tools: games and apps that trained Yendory models play and use, through Nexus"
edition = "2021"
publish = false

[workspace]

[lib]
name = "yendory_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The Yendory Network client (every model move is written by the Network) and the Engine for what
# needs no model: Nexus's markers and announcements, and checking lessons. From yendory-hub
# (dependency/), pinned to one commit; move the pin on purpose.
yendory-client = { git = "https://github.com/SirSkirt/Yendory", rev = "3fd04ac93b279a33c6c62a0f218def66a9e3c021" }
yendory-engine = { git = "https://github.com/SirSkirt/Yendory", rev = "3fd04ac93b279a33c6c62a0f218def66a9e3c021" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# A second copy of Tools hands its --model to the running one (docs/HANDOFF.md on yendory-hub).
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = "thin"
