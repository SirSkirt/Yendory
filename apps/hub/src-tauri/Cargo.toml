[package]
name = "yendory-hub"
version = "0.1.1"
description = "Yendory Hub: create and open models, install and launch the Yendory programs"
edition = "2021"
publish = false

# Built on its own (not part of the root workspace) so Engine CI needs no GUI toolkits.
[workspace]

[lib]
name = "yendory_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
# Packages are checked against the project's updater key before they are installed.
minisign-verify = "0.2"
base64 = "0.22"
# Packages are zip files.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Whether a program is running (it must be closed before it is updated or its model changed).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# The Yendory Network: every model is made and changed through it (the Hub holds no Engine).
yendory-client = { path = "../../../dependency/client" }

# Windows: finding (and removing) a Studio installed by its own installer, and the Hub's own entry
# in Apps & features.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
# Development and tests only: lets YENDORY_RELEASES and YENDORY_UPDATER_KEY replace the release
# page and the updater key. Never on in release builds.
dev-overrides = []

[profile.release]
codegen-units = 1
lto = "thin"
