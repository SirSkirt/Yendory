[package]
name = "yendory-studio"
version = "0.9.7"
description = "Yendory Studio: create, teach, examine and export Bicameral AI models"
edition = "2021"
publish = false

# Built on its own (not part of the root workspace) so Engine CI needs no GUI toolkits.
[workspace]

[lib]
name = "yendory_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
# Hugging Face datasets read from their Parquet files (src/hfparquet.rs). Pure-Rust codecs only
# (the converted files Hugging Face publishes use Snappy).
parquet = { version = "57", default-features = false, features = ["snap", "lz4", "flate2-rust_backened", "json"] }
# Imported datasets (src/imports.rs): CSV / TSV, and gzip-compressed files (pure Rust).
csv = "1"
flate2 = "1"
# Free disk space, checked before a recovery point is written (src/recovery.rs).
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
# The Engine and the Yendory Network client, from yendory-hub (dependency/), pinned to one commit;
# move the pin on purpose (docs/INTEGRATION.md).
yendory-engine = { git = "https://github.com/SirSkirt/Yendory", rev = "f4f03ca49b1e373fb8e420f8f0873fb658dae8ad", features = ["gpu"] }
yendory-client = { git = "https://github.com/SirSkirt/Yendory", rev = "f4f03ca49b1e373fb8e420f8f0873fb658dae8ad" }
# Updates from the release page (signed; see src/update.rs).
tauri-plugin-updater = "2"
# A second copy of Studio hands its --model to the running one (src/handoff.rs).
tauri-plugin-single-instance = "2"
# The Hugging Face token in the system's credential store (src/credentials.rs): Windows Credential
# Manager, the Secret Service on Linux (pure Rust), the Keychain on macOS.
keyring = { version = "3", features = ["windows-native", "apple-native", "async-secret-service", "async-io", "crypto-rust"] }

# Windows: DirectX 12 with the DXC shader compiler built in (instead of the old FXC fallback).
[target.'cfg(all(windows, target_env = "msvc", not(target_arch = "aarch64")))'.dependencies]
yendory-engine = { git = "https://github.com/SirSkirt/Yendory", rev = "f4f03ca49b1e373fb8e420f8f0873fb658dae8ad", features = ["gpu", "dxc"] }

[profile.release]
codegen-units = 1
lto = "thin"
