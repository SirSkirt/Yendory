[package]
name = "yendory-studio"
version = "0.1.0"
description = "Yendory Studio: create, teach, examine and export Bicameral AI models"
edition = "2021"
publish = false

# Built on its own (not part of the root workspace) so Engine CI needs no GUI toolkits.
[workspace]

[lib]
name = "yendory_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
yendory-engine = { path = "../../../crates/yendory-engine" }

[profile.release]
codegen-units = 1
lto = "thin"
